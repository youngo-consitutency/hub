version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    ignore:
      # No patched release exists in drizzle-kit's pinned range (via
      # @payloadcms/db-postgres); the updater otherwise fails on every run.
      # Remove once a fixed esbuild is reachable from the dependency chain.
      - dependency-name: esbuild
      # typescript-eslint does not support TS 7 yet; revisit major bumps
      # manually once the toolchain catches up.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      production-minor-and-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:30'
      timezone: Etc/UTC
    open-pull-requests-limit: 3
