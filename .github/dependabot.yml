version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    ignore:
      # No patched release exists in drizzle-kit's pinned range (via
      # @payloadcms/db-postgres); the updater otherwise fails on every run.
      # Remove once a fixed esbuild is reachable from the dependency chain.
      - dependency-name: esbuild
      # typescript-eslint does not support TS 7 yet; revisit major bumps
      # manually once the toolchain catches up.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      # sentry packages pin each other exactly; split bumps ship two cores
      sentry:
        patterns:
          - '@sentry/*'
      # payload refuses to start unless every payload package is the same version
      payload:
        patterns:
          - 'payload'
          - '@payloadcms/*'
      # eslint-config-next tracks the next release it ships with
      next:
        patterns:
          - 'next'
          - 'eslint-config-next'
      # the type groups still grabbed sentry/payload in #128/#129, so exclude the
      # families explicitly instead of trusting first-match
      production-minor-and-patch:
        dependency-type: production
        exclude-patterns:
          - '@sentry/*'
          - 'payload'
          - '@payloadcms/*'
          - 'next'
          - 'eslint-config-next'
        update-types:
          - minor
          - patch
      development-minor-and-patch:
        dependency-type: development
        exclude-patterns:
          - '@sentry/*'
          - 'payload'
          - '@payloadcms/*'
          - 'next'
          - 'eslint-config-next'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:30'
      timezone: Etc/UTC
    open-pull-requests-limit: 3
