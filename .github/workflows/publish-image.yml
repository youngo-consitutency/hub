name: Publish images

# Builds the app and migration images for the self-hosted deployment (deploy/docker-compose.yml).
# Plain docker commands: the repository only allows SHA-pinned, GitHub-owned actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push the app image
        run: |
          docker build --target runner -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" .
          docker push --all-tags "$IMAGE"
      - name: Build and push the migration image
        run: |
          docker build --target migrate -t "$IMAGE-migrate:latest" -t "$IMAGE-migrate:${{ github.sha }}" .
          docker push --all-tags "$IMAGE-migrate"
