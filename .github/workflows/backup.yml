name: Database backup

# Nightly dump of the production database, encrypted with age before it leaves the runner.
# The private key is kept offline; restore steps are in the wiki (Backups).
on:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AGE_PUBLIC_KEY: age1er9etlc8cgn9ytycmvsf4n8pcq275zjx9wdvrve2k80udmq2vg2sagfdjz
      PG_IMAGE: postgres:17-alpine
    steps:
      - name: Install age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age

      - name: Fetch the Supabase CA
        run: curl -fsS -o supabase-ca.crt https://supabase-downloads.s3-ap-southeast-1.amazonaws.com/prod/ssl/prod-ca-2021.crt

      - name: Dump and encrypt
        env:
          # session pooler URL without a query string; the TLS mode is added below
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL" || { echo "BACKUP_DATABASE_URL is not set" >&2; exit 1; }
          file="hub-$(date -u +%F).sql.gz.age"
          # plain SQL, minus the pg_attver column options only Supabase's Postgres understands
          docker run --rm -e PGSSLROOTCERT=/ca.crt -v "$PWD/supabase-ca.crt:/ca.crt:ro" "$PG_IMAGE" \
            pg_dump --format=plain --clean --if-exists --schema=public --no-owner --no-acl "$DATABASE_URL?sslmode=verify-ca" |
            grep -v 'SET (pg_attver' | gzip -9 | age -r "$AGE_PUBLIC_KEY" > "$file"
          test -s "$file"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hub-backup
          path: hub-*.sql.gz.age
          retention-days: 30
          if-no-files-found: error
