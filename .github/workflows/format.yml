name: Format

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  # Without a PAT, auto-fix pushes emit no events and the final step
  # re-dispatches the other workflows onto the new commit.
  actions: write

env:
  # Fine-grained PAT (contents:write, this repo) makes auto-fix pushes emit
  # pull_request synchronize events so required checks run natively. With
  # GITHUB_TOKEN the push is silent and required checks stay "expected".
  AUTOFIX_TOKEN: ${{ secrets.AUTOFIX_TOKEN }}

concurrency:
  group: format-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  prettier:
    # Forks receive a read-only token and cannot push, so same-repo PRs and
    # manual dispatches only.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.AUTOFIX_TOKEN || github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Format
        run: npx prettier --write .

      - name: Commit formatting changes
        id: commit
        run: |
          if git diff --quiet; then
            echo "Working tree already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: prettier auto-format"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN pushes emit no events, so pull_request checks would never
      # run on the auto-fix commit. Re-dispatched runs report on the commit but
      # cannot satisfy PR-scoped required checks — setting AUTOFIX_TOKEN is the
      # real fix; this keeps verification visible on the commit meanwhile.
      - name: Re-dispatch checks on the auto-fix commit
        if: >-
          steps.commit.outputs.pushed == 'true' &&
          github.event_name == 'pull_request' &&
          env.AUTOFIX_TOKEN == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh workflow run verify.yml --ref "$HEAD_REF"
          gh workflow run neon-preview.yml --ref "$HEAD_REF" -f pr-number="$PR_NUMBER"
          gh workflow run format.yml --ref "$HEAD_REF"
