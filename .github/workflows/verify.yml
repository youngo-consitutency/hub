name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Auto-format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.formatted-commit.outputs.commit }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.sha }}

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Format source files
        run: npm run format

      - name: Commit formatting changes
        if: github.event_name == 'push'
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "style: auto-format [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Require formatted fork contributions
        if: github.event_name == 'pull_request'
        run: git diff --exit-code

      - name: Select formatted commit
        id: formatted-commit
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  test:
    name: Node ${{ matrix.node }}
    needs: format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: youngo_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d youngo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        node:
          - 20.19.0
          - 22

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.format.outputs.commit }}

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Apply PostgreSQL migrations
        run: npm run migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/youngo_test

      - name: Lint, test, and build
        run: npm run check
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/youngo_test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
