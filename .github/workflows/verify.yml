name: Verify

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: youngo_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PAYLOAD_SECRET: ci-build-placeholder
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/youngo_ci
      # Test-only opt-out: the suite drives more auth requests than a real
      # client. Never set this on a deployed environment.
      HUB_DISABLE_RATE_LIMIT: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Prepare the disposable test database
        run: |
          npm run migrate
          npm run seed

      - name: Create temporary push keys for tests
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import webpush from 'web-push';
          const keys = webpush.generateVAPIDKeys();
          fs.appendFileSync(process.env.GITHUB_ENV,
            `VAPID_PUBLIC_KEY=${keys.publicKey}\nVAPID_PRIVATE_KEY=${keys.privateKey}\nVAPID_SUBJECT=mailto:test@example.invalid\n`);
          JS

      - name: Install the test browser
        run: npx playwright install --with-deps chromium

      - name: Test the API and browser flows
        run: |
          npm start -- --hostname 127.0.0.1 > /tmp/youngo-test-server.log 2>&1 &
          test_server_pid=$!
          trap 'kill "$test_server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3000/healthz > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:3000/healthz > /dev/null
          npm run test:int
          npm run test:e2e

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  smoke:
    name: Pre-production smoke
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: youngo_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PAYLOAD_SECRET: ci-smoke-placeholder
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/youngo_smoke

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Migrate the disposable database
        run: npm run migrate

      - name: Start the production build and verify health
        run: |
          npm start -- --hostname 127.0.0.1 > /tmp/youngo-smoke-server.log 2>&1 &
          test_server_pid=$!
          trap 'kill "$test_server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3000/healthz > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:3000/healthz
          npx tsx scripts/ci/smoke.ts
