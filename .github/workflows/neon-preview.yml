name: Neon preview branch

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:
    inputs:
      pr-number:
        description: Pull request number to provision (format.yml re-dispatches this after an auto-fix push, which emits no events)
        required: true

permissions:
  contents: read

concurrency:
  group: neon-pr-${{ github.event.pull_request.number || inputs.pr-number }}
  cancel-in-progress: true

env:
  NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
  NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
  # the project holds more than one database, so neonctl needs telling which
  NEON_DATABASE: ${{ vars.NEON_DATABASE || 'hub' }}
  NEONCTL: npx --yes neonctl@6.0.0
  PR_BRANCH: pr-${{ github.event.pull_request.number || inputs.pr-number }}

jobs:
  # Each open pull request gets an isolated Neon branch (pr-<number>) with
  # migrations applied — proves the schema upgrades against the real Neon
  # stack rather than only the dockerised Postgres in verify.yml. Uses
  # neonctl rather than a third-party action because the repo only allows
  # GitHub-owned actions.
  provision:
    # Dependabot runs without Actions secrets (no NEON_API_KEY), and a Neon
    # branch proves nothing for dependency bumps anyway.
    if: github.event.action != 'closed' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PAYLOAD_SECRET: ci-neon-placeholder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Create or reuse the PR Neon branch
        id: branch
        run: |
          # stdout may contain connection details; keep it out of the log
          if ! $NEONCTL branches create \
            --project-id "$NEON_PROJECT_ID" \
            --name "$PR_BRANCH" > /tmp/neon_create.txt 2>&1; then
            sed -E 's#postgres(ql)?://[^ @]+@#postgres://***@#g' /tmp/neon_create.txt
          fi
          if ! DSN=$($NEONCTL connection-string "$PR_BRANCH" \
            --project-id "$NEON_PROJECT_ID" \
            --database-name "$NEON_DATABASE" \
            --pooled 2> /tmp/neon_dsn_err.txt); then
            # free plan caps branches and a PR stack hits it fast; verify.yml still migrates
            if grep -q 'branches limit exceeded' /tmp/neon_create.txt; then
              echo "::warning::Neon branch cap reached, so $PR_BRANCH was not provisioned. Merge or close a PR, then re-run this job."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            cat /tmp/neon_dsn_err.txt
            exit 1
          fi
          echo "::add-mask::$DSN"
          echo "DATABASE_URL=$DSN" >> "$GITHUB_ENV"

      - run: npm ci
        if: steps.branch.outputs.skip != 'true'
      - name: Apply migrations to the Neon branch
        if: steps.branch.outputs.skip != 'true'
        run: npm run migrate

  cleanup:
    if: github.event.action == 'closed' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Delete the PR Neon branch
        run: |
          $NEONCTL branches delete "$PR_BRANCH" \
            --project-id "$NEON_PROJECT_ID"
