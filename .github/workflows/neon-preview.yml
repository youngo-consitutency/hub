name: Neon preview branch

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read

concurrency:
  group: neon-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Each open pull request gets an isolated Neon branch (pr-<number>) with
  # migrations applied — proves the schema upgrades against the real Neon
  # stack rather than only the dockerised Postgres in verify.yml.
  provision:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Create or reuse Neon branch
        id: neon
        uses: neondatabase/create-branch-action@0fd3f117843efc0931966cd11a8de927b6ea10b4 # v6.2.0
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: pr-${{ github.event.pull_request.number }}
          api_key: ${{ secrets.NEON_API_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: npm ci
      - name: Apply migrations to the Neon branch
        run: npm run migrate
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Delete Neon branch
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3.2.1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: pr-${{ github.event.pull_request.number }}
          api_key: ${{ secrets.NEON_API_KEY }}
