name: CodeRabbit review

on:
  pull_request:
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.repository }}-${{ github.event.number || github.head_ref ||
    github.sha }}-${{ github.workflow }}-${{ github.event_name ==
    'pull_request_review_comment' && 'pr_comment' || 'pr' }}
  cancel-in-progress: ${{ github.event_name != 'pull_request_review_comment' }}

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: coderabbitai/ai-pr-reviewer@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          debug: false
          review_simple_changes: false
          review_comment_lgtm: false
          path_filters: |
            - src/**
            - spa/**
            - mcp-content/**
            - scripts/**
            - '!**/*.md'
            - '!**/payload-types.ts'
            - '!**/package-lock.json'
          system_message: |
            You are reviewing YOUNGO Hub — a Next.js 16 + Payload CMS 3 +
            PostgreSQL application. Prioritise findings in three areas:

            1. Schema and data integrity: Payload collections, SQL migrations
               in src/db/migrations, constraints, indexes, transactions, and
               concurrency hazards (check-then-act races, missing unique
               guards, unsafe upserts).
            2. Security: authorisation checks on every endpoint, the uniform
               error contract ({ error: { code, message, fields? } }),
               secrets or member PII in code or logs, injection risks in raw
               SQL, token handling, and rate-limit bypasses.
            3. Accessibility: ARIA attributes, focus and keyboard handling,
               and semantic markup in spa/src components.

            The repository carries no data — production content and
            identities must never be hardcoded in source. Flag any
            hardcoded emails, names, URLs to live services, or seeded
            fictional records outside database provisioning scripts.
