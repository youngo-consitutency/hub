<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="#0A0F0C"/>
  <!-- YOUNGO-style globe/network icon -->
  <g fill="none" stroke="#00E5A0" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <!-- Globe circle -->
    <circle cx="256" cy="256" r="180" opacity="0.3"/>
    <!-- Horizontal orbit -->
    <ellipse cx="256" cy="256" rx="180" ry="60" opacity="0.5"/>
    <!-- Vertical orbit -->
    <ellipse cx="256" cy="256" rx="60" ry="180" opacity="0.5"/>
    <!-- Diagonal orbit 1 -->
    <ellipse cx="256" cy="256" rx="150" ry="150" transform="rotate(45 256 256)" opacity="0.3"/>
    <!-- Diagonal orbit 2 -->
    <ellipse cx="256" cy="256" rx="150" ry="150" transform="rotate(-45 256 256)" opacity="0.3"/>
  </g>
  <!-- Central hub dot -->
  <circle cx="256" cy="256" r="24" fill="#00E5A0"/>
  <!-- Connection nodes on orbits -->
  <g fill="#00E5A0">
    <circle cx="436" cy="256" r="12"/>
    <circle cx="76" cy="256" r="12"/>
    <circle cx="256" cy="436" r="12"/>
    <circle cx="256" cy="76" r="12"/>
    <circle cx="380" cy="380" r="10" opacity="0.7"/>
    <circle cx="132" cy="132" r="10" opacity="0.7"/>
    <circle cx="380" cy="132" r="10" opacity="0.7"/>
    <circle cx="132" cy="380" r="10" opacity="0.7"/>
  </g>
  <!-- "Y" mark in center -->
  <text x="256" y="272" font-family="system-ui, sans-serif" font-size="80" font-weight="700" fill="#00E5A0" text-anchor="middle" dominant-baseline="middle">Y</text>
</svg>