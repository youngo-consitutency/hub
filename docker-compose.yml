services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: youngo_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # 5433 avoids clashing with a host Postgres already on 5432.
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Optional app-in-container setup. DATABASE_URL inside the container:
  #   postgres://postgres:postgres@postgres:5432/youngo_dev
  payload:
    profiles: ['container-dev']
    image: node:22-alpine
    ports:
      - '3000:3000'
    volumes:
      - .:/home/node/app
      - node_modules:/home/node/app/node_modules
    working_dir: /home/node/app/
    command: sh -c "npm install && npm run migrate && npm run dev"
    depends_on:
      - postgres
    env_file:
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/youngo_dev

volumes:
  pgdata:
  node_modules:
